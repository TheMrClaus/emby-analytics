# emby-analytics — Docker Compose (primary engine).
services:
  emby-analytics:
    image: ghcr.io/themrclaus/emby-analytics:latest
    container_name: emby-analytics
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/emby-analytics
    env_file:
      - .env
    networks:
      mediaserver: null
      traefik: null
networks:
  mediaserver:
    external: true
  traefik:
    external: true
