# Docker rollback definition. Production runs from emby-analytics.container via a rootless Podman user Quadlet.
# Never run Docker and Podman simultaneously against ./data.
# Roll back with: docker compose --profile docker-rollback up -d
services:
  emby-analytics:
    profiles:
      - docker-rollback
    image: ghcr.io/themrclaus/emby-analytics:latest
    container_name: emby-analytics
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/emby-analytics
    env_file:
      - .env
    networks:
      mediaserver:
      pangolin:

networks:
  mediaserver:
    external: true
  pangolin:
    external: true
